[project]
name = "phoenix-card-tools"
version = "0.1.0"
description = "Read eUICC / SIM cards and download eSIM profiles through a Phoenix (USB-serial) reader"
requires-python = ">=3.9"
dependencies = [
    "pyserial>=3.5",
    "requests>=2.28",
]

[project.optional-dependencies]
# The four tools import pySim straight from the vendored `pysim/` clone via
# sys.path, so they do not need this extra. It exists for running the local test
# SM-DP+ (osmo-smdpp.py), which needs pySim's smpp dependencies as well.
smdp = [
    "pySim @ git+https://github.com/osmocom/pysim",
]
